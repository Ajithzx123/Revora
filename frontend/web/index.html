<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Revora — Two-Way Car Marketplace connecting buyers, sellers, and dealers.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Revora">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#0B1324">
  <title>Revora</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0B1324; }
    /* Shown while the app downloads; removed on Flutter's first frame. */
    #revora-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; background: #0B1324;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff;
    }
    #revora-loading .mark {
      width: 64px; height: 64px; border-radius: 21px; background: #F2650C; color: #0B1324;
      display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 800;
    }
    #revora-loading .name { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    #revora-loading .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; }
    #revora-loading .bar::after {
      content: ''; display: block; width: 40%; height: 100%; border-radius: 3px; background: #F2650C;
      animation: revora-slide 1.1s ease-in-out infinite;
    }
    @keyframes revora-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(300%); } }
    @media (prefers-reduced-motion: reduce) { #revora-loading .bar::after { animation: none; width: 100%; } }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="revora-loading" role="status" aria-label="Loading Revora">
    <div class="mark">R</div>
    <div class="name">Revora</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('revora-loading');
      if (el) { el.style.transition = 'opacity .25s'; el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 260); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
